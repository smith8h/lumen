[workspace]
members = ["crates/lumen-core", "crates/lumen"]
default-members = ["crates/lumen"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Hussein Shakir"]
repository = "https://github.com/smith8h/lumen"
rust-version = "1.92"

[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
